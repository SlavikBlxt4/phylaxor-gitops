apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phylaxor-enricher-rb
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "phylaxor.sa" "enricher" }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: phylaxor-enricher-role
  apiGroup: rbac.authorization.k8s.io