apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: phylaxor-read-cluster-binding }
subjects:
- kind: ServiceAccount
  name: phylaxor-sa
  namespace: phylaxor
roleRef:
  kind: ClusterRole
  name: phylaxor-read-cluster
  apiGroup: rbac.authorization.k8s.io
---
{{- if eq .Values.logging.mode "podlogs" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: phylaxor-read-cluster-podlogs-binding }
subjects:
- kind: ServiceAccount
  name: phylaxor-sa
  namespace: phylaxor
roleRef:
  kind: ClusterRole
  name: phylaxor-read-cluster
  apiGroup: rbac.authorization.k8s.io
{{- end }}