apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: phylaxor-read-cluster-binding }
subjects:
- kind: ServiceAccount
  name: {{ include "phylaxor.sa" "enricher" }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: phylaxor-read-cluster
  apiGroup: rbac.authorization.k8s.io