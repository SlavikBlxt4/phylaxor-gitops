apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phylaxor-read-cluster
  labels:
    app.kubernetes.io/name: phylaxor
    app.kubernetes.io/component: enricher
rules:
  # Cluster-wide read-only access (no pod logs here - that's in namespace Role)
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]