apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phylaxor-role
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: [""]
  resources: ["pods","events"]
  verbs: ["get","list","watch"]
{{- if eq .Values.logging.mode "podlogs" }}
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
{{- end }}