apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        ports: [{ containerPort: 6379 }]
        {{- if .Values.redis.storage.enabled }}
        volumeMounts:
        - name: data
          mountPath: /data
        {{- end }}
  {{- if .Values.redis.storage.enabled }}
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: {{ .Values.redis.storage.size }} } }
      storageClassName: {{ .Values.redis.storage.storageClassName | quote }}
  {{- end }}
{{- end }}
