apiVersion: v1
kind: ConfigMap
metadata:
  name: phylaxor-contracts
  namespace: {{ .Values.namespace }}
  labels:
    app: phylaxor
data:
  ai_request.schema.json: |
    {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://phylaxor.dev/schemas/ai_request.schema.json",
        "title": "AIRequest",
        "description": "Schema for the request payload sent to the AI Agent.",
        "type": "object",
        "required": [
            "meta",
            "alert",
            "context",
            "constraints"
        ],
        "properties": {
            "meta": {
                "type": "object",
                "required": [
                    "requestId",
                    "timestamp",
                    "schemaVersion"
                ],
                "properties": {
                    "requestId": {
                        "type": "string",
                        "format": "uuid"
                    },
                    "timestamp": {
                        "type": "string",
                        "format": "date-time"
                    },
                    "schemaVersion": {
                        "type": "string",
                        "pattern": "^\\d+\\.\\d+(\\.\\d+)?$"
                    }
                }
            },
            "alert": {
                "type": "object",
                "required": [
                    "fingerprint",
                    "alertname",
                    "status"
                ],
                "properties": {
                    "fingerprint": {
                        "type": "string"
                    },
                    "alertname": {
                        "type": "string"
                    },
                    "status": {
                        "type": "string"
                    },
                    "startsAt": {
                        "type": "string",
                        "format": "date-time"
                    },
                    "severity": {
                        "type": "string"
                    },
                    "labels": {
                        "type": "object"
                    },
                    "annotations": {
                        "type": "object"
                    }
                }
            },
            "decision": {
                "type": "object",
                "properties": {
                    "source": {
                        "type": "string"
                    },
                    "confidence": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 1
                    },
                    "matched": {
                        "type": "boolean"
                    },
                    "history": {
                        "type": "array",
                        "items": {
                            "type": "object"
                        }
                    }
                }
            },
            "context": {
                "type": "object",
                "required": [
                    "alertContext",
                    "cluster"
                ],
                "properties": {
                    "alertContext": {
                        "type": "object",
                        "properties": {
                            "namespace": {
                                "type": [
                                    "string",
                                    "null"
                                ]
                            },
                            "pod": {
                                "type": [
                                    "string",
                                    "null"
                                ]
                            },
                            "podStatus": {
                                "type": [
                                    "object",
                                    "null"
                                ]
                            },
                            "logs": {
                                "type": [
                                    "string",
                                    "null"
                                ]
                            },
                            "events": {
                                "type": [
                                    "array",
                                    "null"
                                ],
                                "items": {
                                    "type": "object"
                                }
                            },
                            "node": {
                                "type": [
                                    "object",
                                    "null"
                                ]
                            },
                            "storage": {
                                "type": [
                                    "object",
                                    "null"
                                ]
                            },
                            "workload": {
                                "type": [
                                    "object",
                                    "null"
                                ]
                            }
                        }
                    },
                    "cluster": {
                        "type": "object",
                        "properties": {
                            "platform": {
                                "type": "string"
                            },
                            "version": {
                                "type": "string"
                            },
                            "nodes": {
                                "type": "integer"
                            },
                            "nodeSummary": {
                                "type": "object",
                                "properties": {
                                    "ready": {
                                        "type": "integer"
                                    },
                                    "notReady": {
                                        "type": "integer"
                                    }
                                }
                            },
                            "defaultStorageClass": {
                                "type": [
                                    "string",
                                    "null"
                                ]
                            }
                        }
                    }
                }
            },
            "constraints": {
                "type": "object",
                "required": [
                    "readOnly",
                    "noSecrets",
                    "noDestructiveActions"
                ],
                "properties": {
                    "readOnly": {
                        "type": "boolean",
                        "const": true
                    },
                    "noSecrets": {
                        "type": "boolean",
                        "const": true
                    },
                    "noDestructiveActions": {
                        "type": "boolean",
                        "const": true
                    }
                }
            },
            "limits": {
                "type": "object",
                "properties": {
                    "maxOutputTokens": {
                        "type": "integer"
                    },
                    "logs": {
                        "type": "object",
                        "properties": {
                            "maxChars": {
                                "type": "integer"
                            },
                            "tailLines": {
                                "type": "integer"
                            },
                            "sinceSeconds": {
                                "type": "integer"
                            },
                            "dedupeRepeatedLines": {
                                "type": "boolean"
                            }
                        }
                    },
                    "events": {
                        "type": "object",
                        "properties": {
                            "maxItems": {
                                "type": "integer"
                            }
                        }
                    }
                }
            },
            "outputFormat": {
                "type": "object",
                "properties": {
                    "type": {
                        "type": "string",
                        "enum": [
                            "json"
                        ]
                    },
                    "schemaVersion": {
                        "type": "string"
                    }
                }
            }
        }
    }

  ai_response.schema.json: |
    {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://phylaxor.dev/schemas/ai_response.schema.json",
        "title": "AIResponse",
        "description": "Schema for the structured response received from the AI Agent.",
        "type": "object",
        "required": [
            "schemaVersion",
            "requestId",
            "provider",
            "model",
            "summary",
            "triage",
            "hypotheses",
            "recommendedActions",
            "checks",
            "fixes"
        ],
        "properties": {
            "schemaVersion": {
                "type": "string"
            },
            "requestId": {
                "type": "string",
                "format": "uuid"
            },
            "provider": {
                "type": "string"
            },
            "model": {
                "type": "string"
            },
            "summary": {
                "type": "string",
                "maxLength": 500
            },
            "triage": {
                "type": "object",
                "required": [
                    "severity",
                    "confidence",
                    "category"
                ],
                "properties": {
                    "severity": {
                        "type": "string",
                        "enum": [
                            "critical",
                            "warning",
                            "info",
                            "unknown"
                        ]
                    },
                    "confidence": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 1
                    },
                    "category": {
                        "type": "string"
                    }
                }
            },
            "hypotheses": {
                "type": "array",
                "items": {
                    "type": "object",
                    "required": [
                        "title",
                        "confidence",
                        "evidence",
                        "impact"
                    ],
                    "properties": {
                        "title": {
                            "type": "string"
                        },
                        "confidence": {
                            "type": "number",
                            "minimum": 0,
                            "maximum": 1
                        },
                        "evidence": {
                            "type": "array",
                            "items": {
                                "type": "string"
                            }
                        },
                        "impact": {
                            "type": "string"
                        }
                    }
                }
            },
            "recommendedActions": {
                "type": "array",
                "items": {
                    "type": [
                        "string",
                        "object"
                    ]
                }
            },
            "checks": {
                "type": "array",
                "items": {
                    "type": "object",
                    "required": [
                        "title",
                        "commands",
                        "reason"
                    ],
                    "properties": {
                        "title": {
                            "type": "string"
                        },
                        "commands": {
                            "type": "array",
                            "items": {
                                "type": "string"
                            }
                        },
                        "reason": {
                            "type": "string"
                        }
                    }
                }
            },
            "fixes": {
                "type": "array",
                "items": {
                    "type": "object",
                    "required": [
                        "title",
                        "steps",
                        "risk",
                        "requiresWrite"
                    ],
                    "properties": {
                        "title": {
                            "type": "string"
                        },
                        "steps": {
                            "type": "array",
                            "items": {
                                "type": "string"
                            }
                        },
                        "risk": {
                            "type": "string",
                            "enum": [
                                "low",
                                "medium",
                                "high"
                            ]
                        },
                        "requiresWrite": {
                            "type": "boolean"
                        }
                    }
                }
            },
            "missingInfo": {
                "type": "array",
                "items": {
                    "type": "string"
                }
            },
            "safety": {
                "type": "object",
                "properties": {
                    "notes": {
                        "type": "array",
                        "items": {
                            "type": "string"
                        }
                    }
                }
            },
            "suggestedToolCalls": {
                "type": "array",
                "items": {
                    "type": "object",
                    "required": [
                        "tool",
                        "args",
                        "reason"
                    ],
                    "properties": {
                        "tool": {
                            "type": "string"
                        },
                        "args": {
                            "type": "object"
                        },
                        "reason": {
                            "type": "string"
                        }
                    }
                }
            },
            "usage": {
                "type": "object",
                "properties": {
                    "inputTokens": {
                        "type": "integer"
                    },
                    "outputTokens": {
                        "type": "integer"
                    },
                    "estimatedCostUsd": {
                        "type": "number"
                    },
                    "latencyMs": {
                        "type": "integer"
                    }
                }
            }
        }
    }
