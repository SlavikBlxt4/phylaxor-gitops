apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notifier-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  rules:
  - host: phylaxor.local
    http:
      paths:
      - path: /webhook
        pathType: Prefix
        backend:
          service:
            name: notifier
            port:
              number: 8082
