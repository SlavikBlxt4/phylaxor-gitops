apiVersion: apps/v1
kind: Deployment
metadata:
  name: enricher
  namespace: {{ .Release.namespace }}
spec:
  replicas: {{ .Values.replicas.enricher }}
  selector: { matchLabels: { app: enricher } }
  template:
    metadata: { labels: { app: enricher } }
    spec:
      serviceAccountName: {{ include "phylaxor.sa" "enricher" }}
      volumes:
      - name: ctx
        configMap: { name: enricher-context }
      containers:
      - name: enricher
        image: "{{ .Values.images.enricher.repository }}:{{ .Values.images.enricher.tag }}"
        imagePullPolicy: {{ .Values.images.enricher.pullPolicy }}
        volumeMounts: [{ name: ctx, mountPath: /data }]
        env:
        - name: REDIS_HOST
          value: "{{ .Values.serviceConnections.redis.host }}"
        - name: PHYLAXOR_LOGS_MODE
          value: "{{ .Values.logs.mode | default .Values.logging.mode }}"
        - name: PHYLAXOR_EVENTS_ENABLED
          value: "{{ .Values.logs.eventsEnabled | default .Values.logging.eventsEnabled }}"
        - name: PHYLAXOR_LOGS_MAX_LINES
          value: "{{ .Values.logs.maxLines | default .Values.logging.maxLines }}"
        - name: PHYLAXOR_LOGS_MAX_BYTES
          value: "{{ .Values.logs.maxBytes | default .Values.logging.maxBytes }}"
        - name: PHYLAXOR_LOGS_LOOKBACK
          value: "{{ .Values.logs.lookbackSeconds | default .Values.logging.lookbackSeconds }}"
        - name: PHYLAXOR_LOGS_TIMEOUT
          value: "{{ .Values.logs.timeout | default .Values.logging.timeout }}"
        securityContext: {{- toYaml .Values.securityContext | nindent 10 }}
        resources: {{- toYaml .Values.resources.enricher | nindent 10 }}