apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: brain-gateway
spec:
  replicas: {{ .Values.replicas.brain_gateway }}
  selector:
    matchLabels:
      app: brain-gateway
  template:
    metadata:
      labels:
        app: brain-gateway
    spec:
      serviceAccountName: {{ include "phylaxor.sa" "brain-gateway" }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: brain-gateway
          image: "{{ .Values.images.brain_gateway.repository }}:{{ .Values.images.brain_gateway.tag }}"
          imagePullPolicy: {{ .Values.images.brain_gateway.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phylaxor-brain-secrets
                  key: openai_api_key
            - name: CONTRACTS_DIR
              value: "/app/contracts"
          volumeMounts:
            - name: contracts-volume
              mountPath: /app/contracts
              readOnly: true
          resources:
            {{- toYaml .Values.resources.brain_gateway | nindent 12 }}
      volumes:
        - name: contracts-volume
          configMap:
            name: phylaxor-contracts
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
