namespace: phylaxor
namespaceCreate: false
manualAlertManagerConfig: true
images:
  ingest:
    repository: ghcr.io/slavikblxt4/phylaxor-ingest
    tag: "r63-8deebff" # ingest
    pullPolicy: IfNotPresent
  enricher:
    repository: ghcr.io/slavikblxt4/phylaxor-enricher
    tag: "r63-8deebff" # enricher
    pullPolicy: IfNotPresent
  decision:
    repository: ghcr.io/slavikblxt4/phylaxor-decision
    tag: "r70-82099b2" # decision
    pullPolicy: IfNotPresent
  notifier:
    repository: ghcr.io/slavikblxt4/phylaxor-notifier
    tag: "r63-8deebff" # notifier
    pullPolicy: IfNotPresent
  feedback:
    repository: ghcr.io/slavikblxt4/phylaxor-feedback
    tag: "r71-a7cfbf8" # feedback
    pullPolicy: IfNotPresent
  feedback_gateway:
    repository: ghcr.io/slavikblxt4/phylaxor-feedback_gateway
    tag: "r63-8deebff" # feedback_gateway
    pullPolicy: IfNotPresent
  brain_gateway:
    repository: ghcr.io/slavikblxt4/phylaxor-brain_gateway
    tag: r75-fbb5410 # brain_gateway
    pullPolicy: IfNotPresent
ingress:
  service: ingest
imagePullSecrets:
  - ghcr-creds
replicas:
  feedback_gateway: 1
  feedback: 1
  ingest: 1
  enricher: 1
  decision: 1
  notifier: 1
  brain_gateway: 1
resources:
  ingest: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
  enricher: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
  decision: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
  notifier: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
  feedback_gateway: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
  brain_gateway: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
brainGateway:
  debugRaw: false
  debugMock: false
# CAMBIAR A SIGUIENTE CONFIGURACION CUANDO PASEMOS A PRODUCCION
# securityContext:
#   runAsNonRoot: true
#   runAsUser: 10001
#   runAsGroup: 10001
#   fsGroup: 10001
#   readOnlyRootFilesystem: false
#   allowPrivilegeEscalation: false
#   seccompProfile:
#     type: RuntimeDefault
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
logging:
  mode: "none"
  eventsEnabled: true
  maxLines: 500
  maxBytes: 100000
  lookbackSeconds: 300
  timeout: 5
db:
  existingSecret: "phylaxor-db" # Secret con la DSN
  dsnKey: "dsn"
telegram:
  existingSecret: "phylaxor-telegram"
  tokenKey: "token"
  chatIdKey: "chat_id"
env:
  enricherContext:
    platform: "k8s"
    cluster: "minikube"
    version: "1.32"
    storage: "hostpath"
    operators: ["prom-operator"]
expose:
  type: none # none | ingress
  host: phylaxor.localtest.me
  ingressClassName: nginx
serviceConnections:
  redis:
    host: "redis.phylaxor-db.svc.cluster.local"
    port: 6379
  postgres:
    host: "postgres.phylaxor-db.svc.cluster.local"
    port: 5432
