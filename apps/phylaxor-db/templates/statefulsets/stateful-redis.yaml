apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        {{- with .Values.redis.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          {{- if .Values.redis.ports }}
          {{- toYaml .Values.redis.ports | nindent 10 }}
          {{- else }}
          - containerPort: 6379
          {{- end }}
        {{- if .Values.redis.storage.enabled }}
        volumeMounts:
        - name: data
          mountPath: /data
        {{- end }}
  {{- if .Values.redis.storage.enabled }}
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: {{ .Values.redis.storage.size }} } }
      storageClassName: {{ .Values.redis.storage.storageClassName | quote }}
  {{- end }}