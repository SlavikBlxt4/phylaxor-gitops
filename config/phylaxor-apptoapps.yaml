apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phylaxor-apps
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  project: phylaxor
  source:
    repoURL: 'https://github.com/SlavikBlxt4/phylaxor-gitops.git'
    targetRevision: main
    path: 'config/app-catalog/'
    helm:
      valueFiles:
        - "values.yaml"
  destination:
    server: 'https://kubernetes.default.svc'